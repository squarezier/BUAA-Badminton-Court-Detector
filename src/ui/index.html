<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>候羽</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="renderer.js"></script>
</head>
<body>
  <div class="shell">
    <div class="window-bar" aria-hidden="true"></div>
    <div class="compact-bar">
      <strong>候羽</strong>
      <button type="button" id="rail-toggle" aria-expanded="false" aria-controls="sidebar"><span class="menu-icon" aria-hidden="true"></span>导航与设置</button>
    </div>
    <aside class="rail" id="sidebar" aria-label="导航与监控设置">
      <div class="brand"><img src="icon.png" alt="" width="44" height="44"><strong>候羽</strong></div>
      <nav aria-label="应用页面" class="navigation">
        <button type="button" class="nav current" data-page="monitor" aria-current="page"><i id="nav-ink" aria-hidden="true"></i><span class="nav-icon court-icon" aria-hidden="true"></span>场地监控</button>
        <button type="button" class="nav" data-page="target"><span class="nav-icon target-icon" aria-hidden="true"></span>提醒目标</button>
        <button type="button" class="nav" data-page="feishu"><span class="nav-icon chat-icon" aria-hidden="true"></span>飞书通知</button>
      </nav>
      <section class="controls" aria-label="监控设置">
        <fieldset id="campus-field"><legend>监控校区</legend>
          <div class="campus-options">
            <label class="choice"><input type="radio" name="campus" value="shahe" checked><span>沙河</span></label>
            <label class="choice"><input type="radio" name="campus" value="xueyuanlu"><span>学院路</span></label>
          </div>
        </fieldset>
        <form id="interval-form">
          <label for="interval">检查间隔</label>
          <div class="interval-entry">
            <div class="unit-field">
              <input type="number" id="interval" min="1" max="1440" step="1" value="2" inputmode="numeric" required>
              <select id="interval-unit" aria-label="检查间隔单位"><option value="minutes">分钟</option><option value="seconds">秒</option></select>
            </div>
            <button class="button" type="submit" id="save-interval">保存</button>
          </div>
        </form>
      </section>
      <div class="rail-foot">
        <section class="account" aria-label="北航账号">
          <p class="account-state"><i id="account-dot" class="dot" aria-hidden="true"></i><span id="account-state">尚未登录</span></p>
          <button id="account-action" class="quiet" type="button">登录北航</button>
        </section>
      </div>
    </aside>

    <main class="workspace" id="workspace">
      <section id="page-monitor" aria-labelledby="selected-campus">
        <header class="monitor-head">
          <div class="venue-summary">
            <svg class="court-plan" viewBox="-7 -3 75 140" aria-hidden="true" focusable="false">
              <path class="court-lines" d="M0 0h61v134H0z M4.6 0v134 M56.4 0v134 M0 7.6h61 M0 47.2h61 M0 67h61 M0 86.8h61 M0 126.4h61 M30.5 0v47.2 M30.5 86.8V134"></path>
              <path id="serve-arc" pathLength="1" d="M13 99C9 78 23 48 47 42"></path>
              <circle class="serve-mark" cx="13" cy="99" r="1.5"></circle>
              <g id="shuttle" transform="translate(47 42) rotate(-14)"><path class="feathers" d="M1 0-5.7-3.3-6.6.2-5.2 3.6Z M-6.5.2 1 0"></path><circle cx="1.7" cy="0" r="1.5"></circle></g>
            </svg>
            <div class="venue-heading"><h1 id="selected-campus">沙河校区</h1><p id="selected-venues">综合馆</p></div>
            <dl class="availability-total"><dt>校区可约场次</dt><dd id="count">—</dd></dl>
          </div>
          <div class="monitor-toolbar">
            <div id="monitor-state" class="status" data-tone="neutral"><i class="dot" aria-hidden="true"></i><span id="monitor-state-label">等待登录</span><span id="monitor-context" class="sr-only" role="status" aria-atomic="true"></span></div>
            <dl class="check-times">
              <div><dt>上次检查</dt><dd id="checked">—</dd></div>
              <div><dt>下次检查</dt><dd id="next">—</dd></div>
            </dl>
            <button class="button primary" id="monitor-action" type="button" disabled><span class="play-icon" aria-hidden="true"></span><span id="monitor-action-label">开始监控</span></button>
          </div>
        </header>

        <div class="monitor-grid">
          <section class="schedule" aria-labelledby="schedule-title-label">
            <div class="agenda-top">
              <div class="section-head agenda-head">
                <div class="agenda-title"><h2 id="schedule-title-label" tabindex="-1">当前空场</h2><span id="scope" class="subtle" title="官网已核验的日期范围"></span></div>
                <div id="date-filter" class="date-filter" role="group" aria-label="按日期查看空场" hidden></div>
              </div>
              <section id="target-summary" class="target-summary" data-state="all" aria-label="本校区提醒目标">
                <div class="target-when"><span class="target-label"><i class="nav-icon target-icon" aria-hidden="true"></i>提醒目标</span><span id="shortcut-range">全部退订</span><strong id="shortcut-place"></strong></div>
                <span id="shortcut-scope"></span>
                <button class="quiet" type="button" id="open-target"><span id="target-link-label">设置目标</span> <span aria-hidden="true">›</span></button>
              </section>
            </div>
            <div id="read-error" class="warning" role="status" hidden></div>
            <div id="empty" class="empty"><strong id="empty-title">登录北航后可查看场地</strong><p id="empty-note" hidden></p></div>
            <div class="table-wrap" id="table-wrap" hidden>
              <table><thead><tr><th scope="col">日期</th><th scope="col" id="col-time">时段<span class="time-zone"> · 北京时间</span></th><th scope="col" id="col-venue">场馆</th><th scope="col" id="col-courts">场号</th><th scope="col" id="col-price">价格</th></tr></thead><tbody id="rows"></tbody></table>
            </div>
            <div class="booking-links" id="booking-links" aria-label="北航官方预约入口"></div>
          </section>
        </div>
      </section>

      <section id="page-target" aria-labelledby="target-title" hidden>
        <header class="page-head"><div><h1 id="target-title">提醒目标</h1><p id="target-campus"></p></div></header>
        <div class="form-sheet split-sheet">
          <form id="target-form">
            <h2 class="sheet-heading">选择时段</h2>
            <div class="form-row"><label for="target-date">日期</label><input id="target-date" type="date" aria-describedby="target-error" required></div>
            <div class="form-row"><label for="target-start">时段</label><div class="form-value">
              <div class="range-fields"><input id="target-start" type="time" aria-label="开始时间" required><span aria-hidden="true">—</span><input id="target-end" type="time" aria-label="结束时间" aria-describedby="target-error" required></div>
              <p class="field-note">按北京时间，场次须完整落在此时段内。</p>
            </div></div>
            <p class="form-error" id="target-error" role="alert" hidden></p>
            <div class="form-foot"><button type="submit" class="button primary" id="save-target">保存目标</button></div>
          </form>
          <aside class="saved-strip" aria-labelledby="saved-heading">
            <h2 id="saved-heading">当前提醒范围
              <svg class="time-dial" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
                <circle class="dial-track" cx="18" cy="18" r="12"></circle>
                <path class="dial-ticks" d="M18 1v3 M35 18h-3 M18 35v-3 M1 18h3"></path>
                <circle id="dial-range" cx="18" cy="18" r="12" pathLength="1440"></circle>
              </svg>
            </h2>
            <strong id="saved-range"></strong><span id="saved-place"></span>
            <div class="day-band" id="day-band">
              <p id="band-duration"></p>
              <svg viewBox="0 0 1440 24" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <defs><pattern id="hours" width="60" height="24" patternUnits="userSpaceOnUse"><path d="M0 12v5" class="band-tick"></path></pattern></defs>
                <rect class="band-base" x="0" y="10" width="1440" height="5"></rect><rect x="0" y="0" width="1440" height="24" fill="url(#hours)"></rect>
                <path d="M0 9v12 M360 9v12 M720 9v12 M1080 9v12 M1440 9v12" class="band-tick"></path>
                <g id="band-selection">
                  <rect id="band-range" x="0" y="7" width="1440" height="9"></rect>
                  <path id="band-ends" d="M0 3v17 M1440 3v17"></path>
                </g>
              </svg>
              <div aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
            </div>
            <p id="target-coverage"></p>
            <p class="warning" id="saved-note" hidden></p>
            <button class="quiet" type="button" id="clear-target" hidden>移除目标</button>
          </aside>
        </div>
      </section>

      <section id="page-feishu" aria-labelledby="feishu-title" hidden>
        <header class="page-head"><div><h1 id="feishu-title">飞书通知</h1></div></header>
        <div class="form-sheet split-sheet push-sheet">
          <section class="connection-settings" aria-label="群机器人设置">
          <div class="connection-head"><h2>群机器人</h2><span class="status" id="push-status" data-tone="neutral">未连接</span></div>
          <p id="push-service" class="field-note" hidden></p>
          <form id="push-form" autocomplete="off" aria-describedby="connect-note">
            <p class="push-instructions">飞书群设置 → 群机器人 → 添加自定义机器人 <button type="button" class="quiet" id="push-guide" aria-label="打开飞书官方设置指南">指南 ↗</button></p>
            <div class="form-row"><label for="feishu-webhook">Webhook</label><input type="password" id="feishu-webhook" maxlength="256" placeholder="粘贴机器人地址" autocomplete="off" spellcheck="false" required></div>
            <div class="form-row"><label for="feishu-secret">签名密钥</label><input type="password" id="feishu-secret" maxlength="256" placeholder="开启签名校验时填写" autocomplete="off" spellcheck="false"></div>
            <label class="session-choice"><input type="checkbox" id="feishu-session-only">仅本次使用，退出即清除</label>
            <p class="field-note" id="connect-note">连接时会向这个群发送一条测试消息。</p>
            <div class="form-foot"><button type="submit" class="button primary" id="push-connect">连接并测试</button><button type="button" class="quiet" id="cancel-replace" hidden>取消</button></div>
          </form>
          <div class="push-actions" id="push-actions" hidden>
            <button type="button" class="button" id="push-unlock" hidden>重新解锁</button>
            <button type="button" class="button" id="push-test" disabled>发送测试</button>
            <button type="button" class="quiet" id="replace-connection" hidden>更换机器人</button>
            <button type="button" class="quiet danger" id="remove-connection">断开连接</button>
          </div>
          <p id="storage-note" class="field-note" hidden>本次连接在退出后清除。</p>
          <p class="feedback" id="push-feedback" role="status" hidden></p>
          </section>
          <aside class="message-preview" aria-labelledby="sample-heading">
            <h2 id="sample-heading">群消息示例
              <svg class="letter-route" viewBox="0 0 90 30" aria-hidden="true" focusable="false">
                <path id="letter-trail" d="M3 24C18 24 39 19 38 11S23 6 28 16S56 22 76 10"></path>
                <g id="letter-plane" transform="translate(76 10) rotate(-31)"><path d="M4 0-5-3-3 0-5 3Z M-3 0H3"></path></g>
              </svg>
            </h2>
            <div class="message-card">
              <div class="message-top"><img src="icon.png" width="30" height="30" alt=""><div><strong id="preview-title"></strong><small>17:42 · 北京时间</small></div></div>
              <div class="message-body">
                <strong id="preview-date"></strong>
                <p class="sample-slot"><strong>18:00–19:00</strong><span id="preview-venue"></span></p>
                <p class="sample-courts"><span>场号</span><strong>3、5 号</strong><span class="sample-price">·　¥25/场</span></p>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
